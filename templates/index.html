<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support Routing Demo</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="bg-orb orb-a"></div>
  <div class="bg-orb orb-b"></div>

  <main class="page">
    <header class="hero">
      <p class="eyebrow">Operations Copilot</p>
      <h1>Support Message Routing Demo</h1>
      <p class="sub">Bug -> internal ticket, Feature -> task sheet, Question -> manual-grounded reply draft.</p>
    </header>

    <section class="panel controls reveal">
      <div class="control-row">
        <label for="requestType">Request Type</label>
        <select id="requestType"></select>
      </div>
      <button id="runBtn">Run Routing Pipeline</button>
    </section>

    <section class="grid reveal-delay-1">
      <article class="panel">
        <h2>Selected Message</h2>
        <div id="messageCard" class="message-card empty">Choose a request type to preview the message.</div>
      </article>

      <article class="panel">
        <h2>Pipeline Logs</h2>
        <div id="logs" class="logs"></div>
      </article>

      <article class="panel output-panel">
        <h2>Route Outcome</h2>
        <div id="output" class="output empty">No output yet.</div>
      </article>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
